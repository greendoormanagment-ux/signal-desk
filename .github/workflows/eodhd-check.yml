name: EODHD coverage check (run by hand)

# Gate 3 pre-check: does EODHD list the S&P 500 names our free data is missing? Uses ~17 free-tier calls.
# Needs the repository secret EODHD_KEY (Settings → Secrets and variables → Actions). The key is never printed.
# Results land in backtest/audit/eodhd-coverage.md. Read-only for the app.
on:
  workflow_dispatch:
    inputs:
      depth:
        description: "Paid month only: also check full 2016+ history depth"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check coverage
        env:
          EODHD_KEY: ${{ secrets.EODHD_KEY }}
        run: python scripts/backtest/eodhd_coverage.py backtest/audit/sp500_coverage.csv backtest/audit ${{ inputs.depth && '--depth' || '' }}
      - name: Commit results
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtest/audit/eodhd-coverage.md backtest/audit/eodhd-coverage.json
          git diff --cached --quiet || git commit -m "EODHD coverage check"
          git push
