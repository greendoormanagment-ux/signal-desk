name: Nightly SEC EPS update

on:
  schedule:
    - cron: "17 8 * * *"   # every day ~4:17 a.m. Eastern (after the SEC's nightly refresh)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build earnings.json (next earnings dates)
        env:
          AV_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: python scripts/build_earnings.py
      - name: Build eps.json from SEC filings
        run: python scripts/build_eps.py eps.json /tmp/companyfacts.zip
      - name: Build revenue.json from SEC filings (same download; never blocks EPS)
        continue-on-error: true
        run: python scripts/build_revenue.py revenue.json /tmp/companyfacts.zip
      - name: Build market.json (credit spread, VIX, yield curve from FRED; logging only)
        continue-on-error: true
        run: python scripts/build_market.py market.json
      - name: Build footprints.json (short interest, insider buys, estimate revisions; info only, never blocks)
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/build_footprints.py footprints.json
      - name: Save a dated snapshot (history for the 30-day review + backtest)
        run: |
          D=$(date -u +%Y-%m-%d)
          mkdir -p history
          gzip -9 -c eps.json > "history/$D-eps.json.gz"
          if [ -f earnings.json ]; then gzip -9 -c earnings.json > "history/$D-earnings.json.gz"; fi
          if [ -f revenue.json ]; then gzip -9 -c revenue.json > "history/$D-revenue.json.gz"; fi
          if [ -f footprints.json ]; then gzip -9 -c footprints.json > "history/$D-footprints.json.gz"; fi
          ls -la history | tail -3
      - name: Save to the site
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "signal-desk-bot@users.noreply.github.com"
          git add eps.json history
          if [ -f earnings.json ]; then git add earnings.json; fi
          if [ -f revenue.json ]; then git add revenue.json; fi
          if [ -f market.json ]; then git add market.json; fi
          if [ -f footprints.json ]; then git add footprints.json; fi
          git diff --cached --quiet || git commit -m "Nightly SEC EPS + earnings calendar update"
          git pull --rebase origin main
          git push
      - name: Sanity-check the data (emails you if something looks wrong)
        run: python scripts/check_data.py
